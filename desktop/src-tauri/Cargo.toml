[package]
name = "t101-panel"
version = "0.0.3"
description = "T101 对局助手 · 侧边停靠面板（Tauri 壳）"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
