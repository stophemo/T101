<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>T101 · 侧边停靠面板</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171c23;
    --border: #262e38;
    --text: #d7dee8;
    --dim: #8b96a5;
    --accent: #4d9fff;
    --accent2: #2f81f7;
    --ok: #3fbf6f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    -webkit-app-region: drag;
  }
  .logo {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent2), #1b5fc4);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; color: #fff;
  }
  h1 { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }
  .sub { font-size: 11px; color: var(--dim); }
  main { flex: 1; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .status-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--dim);
    flex-shrink: 0;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px rgba(63,191,111,.6); }
  .dot.off { background: #e05252; box-shadow: 0 0 8px rgba(224,82,82,.5); }
  .status-label { font-size: 13px; font-weight: 600; }
  .status-desc { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .btn {
    -webkit-app-region: no-drag;
    width: 100%;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: #1d242d; border-color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent2), #1b5fc4);
    border-color: transparent;
    color: #fff;
  }
  .btn.primary:hover { filter: brightness(1.1); }
  .hint {
    margin-top: auto;
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .hint-row { display: flex; align-items: center; justify-content: space-between; font-size: 12px; color: var(--dim); }
  kbd {
    font-family: inherit;
    font-size: 11px;
    background: #222a34;
    border: 1px solid var(--border);
    border-bottom-width: 2px;
    border-radius: 5px;
    padding: 2px 7px;
    color: var(--text);
  }
</style>
</head>
<body>
  <header>
    <div class="logo">T</div>
    <div>
      <h1>T101 侧边停靠面板</h1>
      <div class="sub">League of Legends 窗口跟随</div>
    </div>
  </header>

  <main>
    <div class="status-card">
      <div class="dot" id="dot"></div>
      <div>
        <div class="status-label" id="statusText">读取状态中…</div>
        <div class="status-desc">自动跟随 LOL 客户端 / 游戏窗口右侧</div>
      </div>
    </div>

    <button class="btn primary" id="btnArrange">一键排布（F9）</button>
    <button class="btn" id="btnDock">暂停 / 恢复跟随（F10）</button>

    <div class="hint">
      <div class="hint-row"><span>排布游戏窗口与面板</span><kbd>F9</kbd></div>
      <div class="hint-row"><span>暂停 / 恢复跟随</span><kbd>F10</kbd></div>
      <div class="hint-row"><span>退出面板</span><kbd>Ctrl+Alt+F12</kbd></div>
    </div>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const hasTauri = typeof window.__TAURI__ !== 'undefined';

  async function invoke(cmd, args) {
    if (hasTauri) {
      return window.__TAURI__.core.invoke(cmd, args || {});
    }
    return null; // 浏览器中打开时无后端
  }

  async function refresh() {
    const docked = await invoke('dock_status');
    if (docked === null) {
      $('dot').className = 'dot off';
      $('statusText').textContent = '非 Tauri 环境（浏览器预览）';
      return;
    }
    $('dot').className = docked ? 'dot on' : 'dot off';
    $('statusText').textContent = docked ? '跟随中' : '已暂停跟随';
    $('btnDock').textContent = docked ? '暂停跟随（F10）' : '恢复跟随（F10）';
  }

  $('btnArrange').addEventListener('click', () => invoke('arrange_windows'));
  $('btnDock').addEventListener('click', async () => {
    const cur = await invoke('dock_status');
    await invoke('set_docked', { enabled: !cur });
    refresh();
  });

  refresh();
</script>
</body>
</html>
