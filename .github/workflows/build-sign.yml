# Windows 构建 + Sigstore 无密钥签名（cosign）+ NSIS 安装包 + GitHub Release
# 在 GitHub 的 Windows runner 上构建，不依赖本地机器。
# 手动触发：Actions → build-sign → Run workflow（默认 master 分支）
# 打 tag（v*）推送时自动构建、签名并发布 Release。
name: build-sign

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # OIDC 令牌，用于 cosign 无密钥签名（不持有任何私钥）
  id-token: write

jobs:
  build-and-sign:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri (release, no bundle)
        run: npm run panel:build

      - uses: sigstore/cosign-installer@v4.1.2

      - name: Sign with Sigstore (keyless)
        shell: pwsh
        run: |
          $exe = "desktop/src-tauri/target/release/t101-panel.exe"
          cosign sign-blob --yes `
            --bundle "$($exe).sigstore.json" `
            $exe

      - name: Bundle NSIS installer (from signed exe)
        run: npm run panel:bundle

      - name: Sign NSIS installer with Sigstore (keyless)
        shell: pwsh
        run: |
          $setup = Get-ChildItem "desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          cosign sign-blob --yes `
            --bundle "$($setup.FullName).sigstore.json" `
            $setup.FullName

      - name: Upload signed artifacts
        uses: actions/upload-artifact@v4
        with:
          name: t101-panel-v0.0.3
          path: |
            desktop/src-tauri/target/release/t101-panel.exe
            desktop/src-tauri/target/release/t101-panel.exe.sigstore.json
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sigstore.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: T101 ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_globs: true
          files: |
            desktop/src-tauri/target/release/t101-panel.exe
            desktop/src-tauri/target/release/t101-panel.exe.sigstore.json
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sigstore.json
